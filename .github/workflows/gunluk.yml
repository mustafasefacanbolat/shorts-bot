name: Günlük Short

on:
  schedule:
    # 10:00 UTC = 13:00 Türkiye (TR yaz saati uygulamıyor, sabit UTC+3)
    # Not: GitHub cron yoğunluğa göre 5-20 dk gecikebilir, bu normaldir.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      deneme:
        description: "Sadece üret, YouTube'a yükleme"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shorts-uretim
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sistem paketleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Python paketleri
        run: pip install -q -r requirements.txt

      - name: Videoyu üret ve yükle
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID:      ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:  ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:  ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:   ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py ${{ inputs.deneme && '--deneme' || '' }}

      - name: Videoyu artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            cikti/**/*.mp4
            cikti/**/senaryo.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Bölüm hafızasını kaydet
        if: success()
        run: |
          git config user.name  "shorts-bot"
          git config user.email "actions@github.com"
          git add state.db
          git diff --staged --quiet || git commit -m "bölüm hafızası güncellendi [skip ci]"
          git push
